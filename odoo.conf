[options]
; Change admin_passwd before going live. It protects the database manager.
admin_passwd = change_me_admin_password
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
proxy_mode = True
list_db = False
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
log_level = info
